name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true

      - name: Test extension and proxy
        run: |
          ./gradlew test
          ./gradlew -p proxy test

      - name: Build extension JAR
        run: ./gradlew embedProxyJar

      - name: Generate checksum
        run: sha256sum build/libs/sunder-all.jar > build/libs/sunder-all.jar.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/libs/sunder-all.jar
          build/libs/sunder-all.jar.sha256
          --title "SUNDER ${GITHUB_REF_NAME#v}"
          --generate-notes
